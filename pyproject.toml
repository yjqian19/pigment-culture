[project]
name = "pigment-culture"
version = "0.1.0"
description = "Blue pigment analysis in paintings using semantic segmentation"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "jupyter>=1.0.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.0.0",
]
